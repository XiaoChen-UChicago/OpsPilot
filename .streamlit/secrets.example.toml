# Copy these values into Streamlit Community Cloud secrets. Do not commit real secrets.
# This example uses Google sign-in plus Gmail send permission.

[auth]
redirect_uri = "https://YOUR_APP.streamlit.app/oauth2callback"
cookie_secret = "replace-with-a-long-random-secret"
expose_tokens = ["access"]

[auth.google]
client_id = "your-google-web-client-id"
client_secret = "your-google-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = { scope = "openid profile email https://www.googleapis.com/auth/gmail.send" }

# Optional: enables live public-web opportunity discovery.
# The current adapter uses a Tavily search API key; leave blank to keep demo-catalog mode.
[discovery]
api_key = "your-web-research-api-key"

# Microsoft Entra is also supported by the mail adapter. If you use it instead,
# replace the [auth.google] block above with the provider block documented in
# docs/DEPLOYMENT.md. Do not configure both providers at the same time.
